version: v1.1

dsn: memory

serve:
  public:
    base_url: http://localhost:4433/
    host: 0.0.0.0
    port: 4433
  admin:
    base_url: http://localhost:4434/
    host: 0.0.0.0
    port: 4434

selfservice:
  default_browser_return_url: http://localhost:8080/
  allowed_return_urls:
    - http://localhost:8080/

  methods:
    password:
      enabled: true

  flows:
    error:
      ui_url: http://localhost:8080/error
    settings:
      ui_url: http://localhost:8080/settings
    recovery:
      enabled: true
      ui_url: http://localhost:8080/recovery
    verification:
      enabled: true
      ui_url: http://localhost:8080/verification
    login:
      ui_url: http://localhost:8080/login
    registration:
      ui_url: http://localhost:8080/registration
    logout:
      after:
        default_browser_return_url: http://localhost:8080/

log:
  level: info
  format: json

secrets:
  cookie:
    - ${KRATOS_COOKIE_SECRET:?required}

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@localhost:1025/?skip_ssl_verify=true
