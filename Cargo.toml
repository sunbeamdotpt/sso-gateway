[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "2026.8.4"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
authors = ["Sunbeam Engineering"]

[workspace.dependencies]
sunbeam-g2v = { version = "0.5.2", default-features = false, features = [
    "axum",
    "auth",
    "metrics",
    "tracing",
    "logging",
    "sqlx",
    "sqlx-postgres",
    "nats",
    "vault",
    "tls",
] }
connectrpc = { version = "0.7" }
buffa = { version = "0.7", features = ["json"] }
buffa-types = { version = "0.7", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8" }
sso-openfga-client = { path = "crates/sso-openfga-client" }
http = { version = "1.2" }
http-body = { version = "1" }
http-body-util = { version = "0.1" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[profile.release]
lto = true
codegen-units = 1

# SSO-027: failures must be handled (match/`?`/logged fallback), never
# panicked through or silently defaulted. priority = -1 keeps targeted
# `#[allow(...)]` overrides (justified invariant unwraps) effective.
[workspace.lints.clippy]
unwrap_used = { level = "deny", priority = -1 }
expect_used = { level = "deny", priority = -1 }
disallowed_methods = { level = "deny", priority = -1 }
# Also deny the pattern lint: no constructing defaults through unwrap_or*
# either — fallbacks must be spelled out as match/map_or_else (SSO-027).
unwrap_or_default = { level = "deny", priority = -1 }
