[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0-rc.9"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
authors = ["Sunbeam Engineering"]

[workspace.dependencies]
sunbeam-g2v = { version = "0.3.3", default-features = false, features = [
    "axum",
    "metrics",
    "tracing",
    "logging",
    "sqlx",
    "sqlx-postgres",
    "nats",
    "jwt",
    "keto",
    "vault",
    "tls",
] }
connectrpc = { version = "0.7" }
buffa = { version = "0.7", features = ["json"] }
buffa-types = { version = "0.7", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8" }
http = { version = "1.2" }
http-body = { version = "1" }
http-body-util = { version = "0.1" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[profile.release]
lto = true
codegen-units = 1
