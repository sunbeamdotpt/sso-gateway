services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ory
      POSTGRES_PASSWORD: ory
      POSTGRES_DB: ory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ory"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate -c /etc/config/hydra/hydra.yml sql -e --yes
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/hydra.yml:/etc/config/hydra/hydra.yml:ro

  hydra:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory?sslmode=disable&max_conns=20&max_idle_conns=4
      URLS_SELF_ISSUER: http://localhost:4444
      URLS_CONSENT: http://localhost:8080/oauth2/consent
      URLS_LOGIN: http://localhost:8080/oauth2/login
      URLS_LOGOUT: http://localhost:8080/oauth2/logout
      SECRETS_SYSTEM: youReallyNeedToChangeThis
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    ports:
      - "4444:4444"   # public
      - "4445:4445"   # admin
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    volumes:
      - ./deploy/hydra.yml:/etc/config/hydra/hydra.yml:ro

  kratos-migrate:
    image: oryd/kratos:v1.3.0
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate sql -e --yes
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/kratos.yml:/etc/config/kratos/kratos.yml:ro

  kratos:
    image: oryd/kratos:v1.3.0
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory?sslmode=disable&max_conns=20&max_idle_conns=4
    command: serve -c /etc/config/kratos/kratos.yml --dev
    ports:
      - "4433:4433"   # public
      - "4434:4434"   # admin
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    volumes:
      - ./deploy/kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ./deploy/kratos-identity.schema.json:/etc/config/kratos/identity.schema.json:ro

  keto-migrate:
    image: oryd/keto:v0.14.0
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate up -y
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/keto.yml:/etc/config/keto/keto.yml:ro

  keto:
    image: oryd/keto:v0.14.0
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory?sslmode=disable&max_conns=20&max_idle_conns=4
    command: serve -c /etc/config/keto/keto.yml
    ports:
      - "4466:4466"   # read
      - "4467:4467"   # write
      - "4469:4469"   # grpc
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    volumes:
      - ./deploy/keto.yml:/etc/config/keto/keto.yml:ro

  sso-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://ory:ory@postgres:5432/ory?sslmode=disable
      REDIS_URL: redis://redis:6379
      HYDRA_ADMIN_URL: http://hydra:4445
      HYDRA_PUBLIC_URL: http://hydra:4444
      KRATOS_ADMIN_URL: http://kratos:4434
      KRATOS_PUBLIC_URL: http://kratos:4433
      KETO_READ_URL: http://keto:4466
      KETO_WRITE_URL: http://keto:4467
      KETO_GRPC_URL: http://keto:4469
      BIND_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    depends_on:
      - hydra
      - kratos
      - keto
      - redis

volumes:
  postgres-data:
